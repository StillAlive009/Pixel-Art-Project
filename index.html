<script>
    const upload = document.getElementById('upload');
    const sourceImg = document.getElementById('sourceImg');
    const canvas = document.getElementById('pixelCanvas');
    const scaleSlider = document.getElementById('pixelScale');
    const scaleVal = document.getElementById('scaleVal');

    // Function to run the conversion software
    function convertToPixel() {
        // Ensure the source image has an actual image loaded
        if (!sourceImg.complete || sourceImg.naturalWidth === 0) return;
        
        const scale = parseInt(scaleSlider.value);
        scaleVal.innerText = scale;

        // Initialize the library configurations
        const px = new pixelit({
            from: sourceImg,
            to: canvas,
            scale: scale
        });
        
        px.draw().pixelate(); // Run the conversion engine
    }

    // Handle user image upload safely
    upload.addEventListener('change', function(e) {
        const file = e.target.files[0]; // Get the single uploaded file
        if (file) {
            const reader = new FileReader();
            
            // Wait until the file reader finishes reading the data
            reader.onload = function(event) {
                sourceImg.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    // CRITICAL FIX: Explicitly listen for when the image finishes loading its data source
    sourceImg.addEventListener('load', function() {
        convertToPixel();
    });

    // Re-run conversion when the slider moves
    scaleSlider.addEventListener('input', convertToPixel);
</script>
