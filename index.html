<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>96x96 Pixel Art Converter</title>
    
    <!-- Force browser to grab fresh layouts and bypass old caching memory -->
    <meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />

    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #222; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #333; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input[type="file"] { margin: 20px 0; }
        .btn { display: none; background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; text-decoration: none; font-weight: bold; }
        .btn:hover { background: #0056b3; }
        
        /* Large square visual screen previewer frame */
        .canvas-container { 
            margin: 20px auto; 
            display: flex; 
            justify-content: center; 
            width: 384px !important; 
            height: 384px !important;
        }
        
        canvas { 
            border: 2px dashed #555; 
            background: #111; 
            width: 384px !important; 
            height: 384px !important; 
            display: block;
            image-rendering: pixelated; 
            image-rendering: crisp-edges; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>96x96 Pixel Converter</h1>
    <p>Upload an image to convert it into a crisp 96x96 pixel art sprite.</p>
    
    <input type="file" id="upload" accept="image/*">
    
    <div class="canvas-container">
        <canvas id="pixelCanvas"></canvas>
    </div>
    
    <div>
        <a id="downloadBtn" class="btn">Export Pixel Art</a>
    </div>
</div>

<script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    upload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                // Step 1: Set downsampled canvas processing size
                canvas.width = 96;
                canvas.height = 96;

                // Step 2: Clear workspace clean
                ctx.clearRect(0, 0, 96, 96);

                // Step 3: CRITICAL BUG FIX - Smoothing flags must be set AFTER changing width/height
                ctx.imageSmoothingEnabled = false;
                ctx.mozImageSmoothingEnabled = false;
                ctx.webkitImageSmoothingEnabled = false;
                ctx.msImageSmoothingEnabled = false;

                // Step 4: Center crop the dimensions into a perfect square aspect ratio
                let sourceX = 0;
                let sourceY = 0;
                let sourceSize = Math.min(img.width, img.height);

                if (img.width > img.height) {
                    sourceX = Math.round((img.width - img.height) / 2);
                } else {
                    sourceY = Math.round((img.height - img.width) / 2);
                }

                // Step 5: Draw downsampled pixels cleanly into the square bounds
                ctx.drawImage(
                    img, 
                    sourceX, sourceY, sourceSize, sourceSize,
                    0, 0, 96, 96
                );

                // Step 6: Link 96x96 data pipelines for exporting PNGs
                downloadBtn.href = canvas.toDataURL('image/png');
                downloadBtn.download = 'pixel-art-96x96.png';
                downloadBtn.style.display = 'inline-block';
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });
</script>

</body>
</html>
