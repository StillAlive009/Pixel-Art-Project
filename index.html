<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>96x96 Pixel Art Converter</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #222; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #333; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input[type="file"] { margin: 20px 0; }
        .btn { display: none; background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; text-decoration: none; font-weight: bold; }
        .btn:hover { background: #0056b3; }
        
        /* FIXED VISUAL VIEWER: Constrains the container and forces a 96x96 square aspect ratio */
        .canvas-container { 
            margin: 20px auto; 
            display: flex; 
            justify-content: center; 
            width: 96px !important; 
            height: 96px !important;
        }
        
        canvas { 
            border: 2px dashed #555; 
            background: #111; 
            width: 96px !important; 
            height: 96px !important; 
            display: block;
            image-rendering: pixelated; 
            image-rendering: crisp-edges; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>96x96 Pixel Converter</h1>
    <p>Upload an image to convert it into a crisp 96x96 pixel art sprite.</p>
    
    <input type="file" id="upload" accept="image/*">
    
    <div class="canvas-container">
        <canvas id="pixelCanvas"></canvas>
    </div>
    
    <div>
        <a id="downloadBtn" class="btn">Export Pixel Art</a>
    </div>
</div>

<script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    // DATA MATRIX FIX: Locks the internal data rendering grids to 96x96 pixels
    canvas.width = 96;
    canvas.height = 96;

    upload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                ctx.clearRect(0, 0, 96, 96);

                // Prevent the browser from applying anti-alias blurring filters
                ctx.imageSmoothingEnabled = false;
                ctx.mozImageSmoothingEnabled = false;
                ctx.webkitImageSmoothingEnabled = false;
                ctx.msImageSmoothingEnabled = false;

                // Center-cropping formula to fit any rectangular upload into the square grid template
                let sourceX = 0;
                let sourceY = 0;
                let sourceSize = Math.min(img.width, img.height);

                if (img.width > img.height) {
                    sourceX = Math.round((img.width - img.height) / 2);
                } else {
                    sourceY = Math.round((img.height - img.width) / 2);
                }

                // Compress image content down strictly to the 96x96 raster frame bounds
                ctx.drawImage(
                    img, 
                    sourceX, sourceY, sourceSize, sourceSize,
                    0, 0, 96, 96
                );

                // Format export data download structures
                downloadBtn.href = canvas.toDataURL('image/png');
                downloadBtn.download = 'pixel-art-96x96.png';
                downloadBtn.style.display = 'inline-block';
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });
</script>

</body>
</html>
